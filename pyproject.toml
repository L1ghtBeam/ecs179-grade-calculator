[project]
name = "grade-calc"
version = "0.1.0"
description = "Calculate grades for ECS 179 based on TOML files."
readme = "README.md"
authors = [
    { name = "Colin Rodriguez", email = "corodriguez@ucdavis.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "tomlkit>=0.15.3",
]

[project.scripts]
grade-calc = "grade_calc:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
